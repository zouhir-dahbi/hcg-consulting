name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        # Project page for now (BASE_PATH=/hcg-consulting). Once the
        # custom domain is bought and pointed at Cloudflare, set
        # SITE_URL to the domain and BASE_PATH to "/" — no code changes.
        #
        # PUBLIC_FORM_ENDPOINT + PUBLIC_TURNSTILE_SITE_KEY: fill in once
        # the Cloudflare Worker (cloudflare/worker) and a Turnstile
        # widget are live. Until then the contact form gracefully degrades
        # to a "call or email" state.
        env:
          SITE_URL: https://zouhir-dahbi.github.io/hcg-consulting
          BASE_PATH: /hcg-consulting
          PUBLIC_FORM_ENDPOINT: ""
          PUBLIC_TURNSTILE_SITE_KEY: ""
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
